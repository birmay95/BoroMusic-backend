databaseChangeLog:
  - changeSet:
      id: 000-setup-extensions
      author: borovenskyy@gmail.com
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS pg_trgm;

  - changeSet:
      id: 001-create-users-table
      author: borovenskyy@gmail.com
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    unique: true
              - column:
                  name: username
                  type: varchar(255)
                  constraints:
                    unique: true
              - column:
                  name: password
                  type: varchar(255)
              - column:
                  name: role
                  type: varchar(50)
              - column:
                  name: email_verified
                  type: boolean
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp

  - changeSet:
      id: 002-create-verification_token-table
      author: borovenskyy@gmail.com
      changes:
        - createTable:
            tableName: verification_token
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: varchar(255)
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    unique: true
                    references: users(id)
                    foreignKeyName: fk_token_user
              - column:
                  name: expiry_date
                  type: timestamp

  - changeSet:
      id: 003-create-artists-table
      author: borovenskyy@gmail.com
      changes:
        - createTable:
            tableName: artists
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    unique: true
                    references: users(id)
                    foreignKeyName: fk_artist_user

  - changeSet:
      id: 004-create-albums-table
      author: borovenskyy@gmail.com
      changes:
        - createTable:
            tableName: albums
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
              - column:
                  name: artist_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: artists(id)
                    foreignKeyName: fk_album_artist
              - column:
                  name: created_at
                  type: timestamp

  - changeSet:
      id: 005-create-tracks-table
      author: borovenskyy@gmail.com
      changes:
        - createTable:
            tableName: tracks
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: title
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: album_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: albums(id)
                    foreignKeyName: fk_track_album
              - column:
                  name: file_name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: content_type
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: file_size
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: duration
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: uploaded_by
                  type: uuid
                  constraints:
                    references: users(id)
                    foreignKeyName: fk_track_uploaded_by

  - changeSet:
      id: 006-create-genres-table
      author: borovenskyy@gmail.com
      changes:
        - createTable:
            tableName: genres
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true

  - changeSet:
      id: 007-create-playlists-table
      author: borovenskyy@gmail.com
      changes:
        - createTable:
            tableName: playlists
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_playlist_user
              - column:
                  name: created_at
                  type: timestamp

  - changeSet:
      id: 008-create-artist_requests-table
      author: borovenskyy@gmail.com
      changes:
        - createTable:
            tableName: artist_requests
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: status
                  type: varchar(50)
              - column:
                  name: requested_name
                  type: varchar(255)
              - column:
                  name: admin_comment
                  type: text
              - column:
                  name: created_at
                  type: timestamp
              - column:
                  name: target_artist_id
                  type: uuid
                  constraints:
                    references: artists(id)
                    foreignKeyName: fk_request_target_artist
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_request_user

  - changeSet:
      id: 009-create-refresh_token-table
      author: borovenskyy@gmail.com
      changes:
        - createTable:
            tableName: refresh_token
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
                    references: users(id)
                    foreignKeyName: fk_refresh_token_user
              - column:
                  name: expiry_date
                  type: timestamp
                  constraints:
                    nullable: false

  - changeSet:
      id: 010-create-join-tables
      author: borovenskyy@gmail.com
      changes:
        - createTable:
            tableName: user_favourites
            columns:
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: users(id)
                    foreignKeyName: fk_fav_user
              - column:
                  name: track_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: tracks(id)
                    foreignKeyName: fk_fav_track
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
        - addPrimaryKey:
            tableName: user_favourites
            columnNames: user_id, track_id
            constraintName: pk_user_favourites

        - createTable:
            tableName: playlist_tracks
            columns:
              - column:
                  name: playlist_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: playlists(id)
                    foreignKeyName: fk_pt_playlist
              - column:
                  name: track_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: tracks(id)
                    foreignKeyName: fk_pt_track
        - addPrimaryKey:
            tableName: playlist_tracks
            columnNames: playlist_id, track_id
            constraintName: pk_playlist_tracks

        - createTable:
            tableName: track_artists
            columns:
              - column:
                  name: track_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: tracks(id)
                    foreignKeyName: fk_ta_track
              - column:
                  name: artist_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: artists(id)
                    foreignKeyName: fk_ta_artist
        - addPrimaryKey:
            tableName: track_artists
            columnNames: track_id, artist_id
            constraintName: pk_track_artists

        - createTable:
            tableName: track_genres
            columns:
              - column:
                  name: track_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: tracks(id)
                    foreignKeyName: fk_tg_track
              - column:
                  name: genre_id
                  type: uuid
                  constraints:
                    nullable: false
                    references: genres(id)
                    foreignKeyName: fk_tg_genre
        - addPrimaryKey:
            tableName: track_genres
            columnNames: track_id, genre_id
            constraintName: pk_track_genres

  - changeSet:
      id: 011-create-btree-indexes
      author: borovenskyy@gmail.com
      changes:
        - createIndex: { indexName: idx_users_created_at, tableName: users, columns: [{ column: { name: created_at } }] }

        - createIndex: { indexName: idx_tracks_created_at, tableName: tracks, columns: [{ column: { name: created_at } }] }
        - createIndex: { indexName: idx_tracks_album_id, tableName: tracks, columns: [{ column: { name: album_id } }] }
        - createIndex: { indexName: idx_tracks_uploaded_by, tableName: tracks, columns: [{ column: { name: uploaded_by } }] }

        - createIndex: { indexName: idx_albums_created_at, tableName: albums, columns: [{ column: { name: created_at } }] }
        - createIndex: { indexName: idx_albums_artist_id, tableName: albums, columns: [{ column: { name: artist_id } }] }

        - createIndex: { indexName: idx_playlists_created_at, tableName: playlists, columns: [{ column: { name: created_at } }] }
        - createIndex: { indexName: idx_playlists_user_id, tableName: playlists, columns: [{ column: { name: user_id } }] }

        - createIndex: { indexName: idx_requests_status, tableName: artist_requests, columns: [{ column: { name: status } }] }
        - createIndex: { indexName: idx_requests_created_at, tableName: artist_requests, columns: [{ column: { name: created_at } }] }
        - createIndex: { indexName: idx_requests_user_id, tableName: artist_requests, columns: [{ column: { name: user_id } }] }
        - createIndex: { indexName: idx_requests_target_artist, tableName: artist_requests, columns: [{ column: { name: target_artist_id } }] }

        - createIndex: { indexName: idx_verif_token_expiry, tableName: verification_token, columns: [{ column: { name: expiry_date } }] }
        - createIndex: { indexName: idx_refresh_token_expiry, tableName: refresh_token, columns: [{ column: { name: expiry_date } }] }

        - createIndex: { indexName: idx_user_fav_track_id, tableName: user_favourites, columns: [{ column: { name: track_id } }] }
        - createIndex: { indexName: idx_user_fav_created_at, tableName: user_favourites, columns: [{ column: { name: created_at } }] }
        - createIndex: { indexName: idx_pt_track_id, tableName: playlist_tracks, columns: [{ column: { name: track_id } }] }
        - createIndex: { indexName: idx_tg_genre_id, tableName: track_genres, columns: [{ column: { name: genre_id } }] }
        - createIndex: { indexName: idx_ta_artist_id, tableName: track_artists, columns: [{ column: { name: artist_id } }] }

  - changeSet:
      id: 012-create-gin-indexes
      author: borovenskyy@gmail.com
      changes:
        - sql:
            sql: CREATE INDEX idx_tracks_title_gin ON tracks USING GIN (title gin_trgm_ops);
        - sql:
            sql: CREATE INDEX idx_artists_name_gin ON artists USING GIN (name gin_trgm_ops);
        - sql:
            sql: CREATE INDEX idx_albums_title_gin ON albums USING GIN (title gin_trgm_ops);
        - sql:
            sql: CREATE INDEX idx_playlists_name_gin ON playlists USING GIN (name gin_trgm_ops);

  - changeSet:
      id: 013-setup-pgvector-extension
      author: borovenskyy@gmail.com
      changes:
        - sql:
            sql: CREATE EXTENSION IF NOT EXISTS vector;

  - changeSet:
      id: 014-create-feature_vectors-table
      author: borovenskyy@gmail.com
      changes:
        - createTable:
            tableName: feature_vectors
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: track_id
                  type: uuid
                  constraints:
                    nullable: false
                    unique: true
                    references: tracks(id)
                    foreignKeyName: fk_feature_vector_track
              - column:
                  name: mood_vector
                  type: vector(2)

  - changeSet:
      id: 015-create-feature_vectors-indexes
      author: borovenskyy@gmail.com
      changes:
        - createIndex:
            indexName: idx_feature_vectors_track_id
            tableName: feature_vectors
            columns:
              - column: { name: track_id }

        - sql:
            sql: CREATE INDEX idx_mood_vector_hnsw ON feature_vectors USING hnsw (mood_vector vector_l2_ops);